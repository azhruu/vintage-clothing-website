<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search Results | Maison Archive</title>
    <meta name="description" content="Search Maison Archive for vintage clothing by product, category, color, size, brand, or collection.">
    <meta property="og:title" content="Search Results | Maison Archive">
    <meta property="og:description" content="Search premium vintage clothing and rare archive pieces.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script defer src="app.js"></script>
  </head>
  <body data-page="search">
    <div id="site-header"></div>

    <main class="page-shell">
      <section class="page-hero">
        <div class="container page-intro reveal">
          <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Search</span></nav>
          <h1>Search The Archive</h1>
          <p>Find pieces by product name, category, color, size, style, brand, collection, or condition.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="shop-toolbar">
            <div class="shop-search">
              <label for="searchPageInput">Search</label>
              <input id="searchPageInput" type="search" placeholder="Try denim, leather, olive, or workwear" autocomplete="off">
            </div>
            <div class="product-count" id="searchCount">Search the archive</div>
          </div>
          <div class="product-grid" id="searchResults" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
    <div id="quick-view-root"></div>
    <div id="cart-drawer-root"></div>
    <div id="toast-root" class="toast-root"></div>
  </body>
</html>
